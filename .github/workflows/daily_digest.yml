name: Daily Aerospace Digest

on:
  schedule:
    # 18:00 UTC every day. GitHub interprets cron times in UTC.
    - cron: "0 18 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow the auto-commit of state files

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: aero-cache-${{ github.run_id }}
          restore-keys: |
            aero-cache-

      - name: Run daily digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py

      - name: Commit and push state files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_digest.txt data/subscribers.json cache/
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'Update digest and subscriber state'
            git push
          fi
